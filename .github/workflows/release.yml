name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package

      - name: Sign with Mozilla (when AMO_API_KEY and AMO_API_SECRET secrets are set)
        if: env.AMO_API_KEY != ''
        run: |
          npx web-ext sign --channel unlisted --source-dir dist --artifacts-dir signed \
            --api-key "$AMO_API_KEY" --api-secret "$AMO_API_SECRET"
          VERSION=$(node -p "require('./static/manifest.json').version")
          rm out/*.xpi
          cp signed/*.xpi "out/humanly-tts-$VERSION.xpi"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
